<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Hệ Thống Lọc & Nhận Coupon Cao Cấp</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    
    <style>
        :root {
            --primary: #0284c7;
            --primary-light: #e0f2fe;
            --primary-hover: #0369a1;
            --success: #10b981;
            --success-light: #d1fae5;
            --success-hover: #059669;
            --danger: #f43f5e;
            --dark: #1e293b;
            --gray-bg: #f8fafc;
            --border: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.2px;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            margin: 0; 
            padding: 24px 16px;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%); 
            color: var(--text-main); 
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { 
            width: 100%;
            max-width: 680px; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 32px 24px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px -15px rgba(2, 132, 199, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: relative;
        }

        /* Tối ưu Top Navbar hiển thị 3 nút ngang hàng */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 680px;
            gap: 8px;
        }

        .btn-toggle-admin {
            flex: 1 1 0px;
            min-width: 0;
            background: #ffffff;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 11px 8px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-toggle-admin:active { transform: scale(0.98); }
        .btn-toggle-admin:hover { background: var(--gray-bg); border-color: var(--text-muted); }

        .app-header { text-align: center; margin-bottom: 32px; }
        .app-header h2 { font-size: 26px; color: var(--dark); margin: 0 0 10px 0; font-weight: 700; }
        .app-header p { color: var(--text-muted); margin: 0; font-size: 14px; line-height: 1.5; }

        h3 { 
            font-size: 16px; font-weight: 600; color: var(--dark); 
            margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
        }

        .section-user {
            border: 1px solid rgba(2, 132, 199, 0.15); 
            border-radius: 20px; background: #ffffff; padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.02);
        }

        .input-group { margin-bottom: 18px; position: relative; }
        .input-group i {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 15px; pointer-events: none;
        }

        .input-label { font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; display: block; }

        input[type="text"], input[type="password"], input[type="datetime-local"], textarea { 
            width: 100%; padding: 14px 14px 14px 46px; border-radius: 14px; 
            border: 1px solid var(--border); font-size: 15px; box-sizing: border-box;
            background: var(--gray-bg); color: var(--dark); transition: all 0.2s ease;
        }

        textarea { padding: 12px 14px; font-family: monospace; font-size: 13px; resize: vertical; }

        input:focus, textarea:focus {
            outline: none; border-color: var(--primary); background: #ffffff;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
        }

        input:disabled { background-color: #f1f5f9; color: #94a3b8; cursor: not-allowed; }

        button { 
            width: 100%; padding: 14px 20px; border-radius: 14px; border: none;
            cursor: pointer; font-weight: 600; font-size: 15px; display: inline-flex;
            justify-content: center; align-items: center; gap: 8px; transition: all 0.2s ease; 
        }

        button:active { transform: scale(0.98); }

        .admin-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; 
            height: 100vh; height: 100dvh; background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 1000; justify-content: center;
            align-items: center; padding: 16px;
        }

        .modal-content {
            background: #ffffff; width: 100%; max-width: 540px; border-radius: 24px;
            padding: 28px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            position: relative; max-height: 90vh; max-height: 90dvh; overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-close {
            position: absolute; top: 20px; right: 20px; background: var(--gray-bg);
            border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 14px; transition: 0.2s;
        }

        .modal-close:hover { background: #e2e8f0; color: var(--dark); }

        .btn-admin { background-color: var(--dark); color: white; }
        .btn-admin:hover { background-color: #0f172a; }

        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:hover { background-color: #e11d48; }

        .btn-secondary { background-color: var(--primary); color: white; margin-top: 8px; }
        .btn-secondary:hover { background-color: var(--primary-hover); }

        .admin-section-title {
            font-size: 13px; font-weight: 700; color: var(--dark); margin: 18px 0 10px 0;
            display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }

        .stat-card {
            background: var(--gray-bg); border: 1px solid var(--border);
            border-radius: 14px; padding: 12px 10px; text-align: center;
        }

        .stat-card .stat-value { font-size: 22px; font-weight: 700; margin-top: 4px; line-height: 1.2; }
        .stat-card.remaining .stat-value { color: var(--success); }
        .stat-card.claimed .stat-value { color: var(--danger); }
        .stat-card.total .stat-value { color: var(--primary); }
        .stat-card .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }

        .product-stats-list {
            max-height: 180px; overflow-y: auto; border: 1px solid var(--border);
            border-radius: 14px; padding: 8px 14px; background: #ffffff;
        }

        .product-stat-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13px;
        }

        .product-stat-item:last-child { border-bottom: none; }
        .product-stat-name {
            font-weight: 600; color: var(--dark); white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; max-width: 65%;
        }

        .product-stat-count {
            font-weight: 700; font-size: 12px; padding: 4px 10px;
            border-radius: 8px; transition: all 0.2s ease; white-space: nowrap;
        }

        .product-stat-count.badge-unused { background: var(--primary-light); color: var(--primary-hover); }
        .product-stat-count.badge-used { background: #ffe4e6; color: #e11d48; border: 1px solid #fecdd3; }

        .file-upload-wrapper {
            margin: 10px 0; padding: 14px; border: 2px dashed var(--border);
            border-radius: 14px; text-align: center; background: var(--gray-bg);
        }
        
        input[type="file"] { font-size: 13px; color: var(--text-muted); width: 100%; }

        .product-card {
            background: #ffffff; border: 1px solid var(--border);
            border-radius: 16px; margin-top: 24px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .product-title { 
            font-size: 15px; font-weight: 700; color: var(--dark); 
            background: #f8fafc; padding: 14px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 8px;
        }

        .coupon-list { padding: 10px 20px; }

        .coupon-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 14px 0; border-bottom: 1px dashed var(--border); gap: 12px;
            transition: all 0.3s ease;
        }
        .coupon-item:last-child { border-bottom: none; }

        .coupon-item.claimed {
            opacity: 0.6;
            background: #f8fafc;
            padding: 10px 14px;
            border-radius: 12px;
            margin: 6px 0;
            border-bottom: none;
        }

        .coupon-code {
            font-family: monospace; font-weight: 700; background: var(--primary-light);
            color: var(--primary-hover); padding: 8px 14px; border-radius: 10px;
            font-size: 15px; letter-spacing: 0.5px;
        }

        .coupon-item.claimed .coupon-code {
            background: #e2e8f0;
            color: #64748b;
        }

        .claimed-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }

        .claimed-user {
            font-size: 13px;
            font-weight: 700;
            color: #e11d48;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .claimed-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .btn-copy { 
            background-color: var(--success); color: white; padding: 10px 18px; 
            font-size: 14px; width: auto; border-radius: 10px; white-space: nowrap;
        }
        .btn-copy:hover { background-color: var(--success-hover); }

        #adminStatus, #textStatus { margin-top: 14px; font-size: 13px; font-weight: 500; text-align: center; }
        .status-success { color: var(--success); }
        .status-error { color: var(--danger); }

        .loading-spinner { color: var(--text-muted); text-align: center; font-size: 14px; margin: 20px 0; }

        .toast-container {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 2000; display: flex; flex-direction: column; gap: 8px;
            pointer-events: none; width: max-content; max-width: 90vw;
        }

        .toast {
            background: var(--dark); color: #ffffff; padding: 12px 20px; border-radius: 50px;
            font-size: 14px; font-weight: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 10px; opacity: 0;
            transform: translateY(20px); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: #065f46; color: #a7f3d0; }
        .toast-error { background: #881337; color: #fecdd3; }
        .toast-info { background: #0f172a; color: #f1f5f9; }

        /* Media Query tối ưu hóa hiển thị Mobile */
        @media (max-width: 576px) {
            body { padding: 16px 12px; }
            .container { padding: 20px 14px; border-radius: 20px; }
            .app-header h2 { font-size: 22px; }

            /* Tối ưu 3 nút top navbar cho mobile */
            .top-navbar { gap: 5px; }
            .btn-toggle-admin { 
                font-size: 11px; 
                padding: 10px 2px; 
                gap: 4px; 
                border-radius: 10px;
            }
            .btn-toggle-admin i {
                font-size: 12px;
            }

            input[type="text"], input[type="password"], input[type="datetime-local"], textarea {
                font-size: 16px !important; padding: 12px 12px 12px 42px;
            }
            textarea { padding: 12px; }

            .admin-modal { align-items: flex-end; padding: 0; }
            .modal-content {
                width: 100%; max-width: 100%; border-radius: 24px 24px 0 0;
                padding: 24px 18px 32px 18px; max-height: 85dvh;
                animation: slideUpBottom 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }

            @keyframes slideUpBottom {
                from { transform: translateY(100%); }
                to { transform: translateY(0); }
            }

            .coupon-list { padding: 8px 14px; }
            .coupon-item {
                flex-direction: row !important; justify-content: space-between !important;
                align-items: center !important; padding: 12px 0;
            }
            .coupon-code { font-size: 14px; padding: 8px 10px; }
            .btn-copy { width: auto !important; padding: 8px 14px !important; font-size: 13px !important; }
            
            .stats-grid { gap: 6px; }
            .stat-card .stat-value { font-size: 18px; }
            .stat-card .stat-label { font-size: 10px; }

            .toast-container { bottom: 16px; }
        }

        @media (max-width: 360px) {
            .btn-toggle-admin { font-size: 10px; padding: 8px 1px; gap: 3px; }
        }
    </style>
</head>
<body>

<div class="top-navbar">
    <button class="btn-toggle-admin" onclick="openTextModal()">
        <i class="fa-solid fa-paste"></i> UPDATE PMH
    </button>
    <button class="btn-toggle-admin" onclick="openAdminModal()">
        <i class="fa-solid fa-chart-pie"></i> THỐNG KÊ
    </button>
    <button class="btn-toggle-admin" onclick="handleManualUpdate(this)">
        <i class="fa-solid fa-rotate"></i> CẬP NHẬT
    </button>
</div>

<div class="container">
    <div class="app-header">
        <h2><i class="fa-solid fa-ticket" style="color: var(--primary);"></i> COUPON, PMH VÙNG, PMH GVGS_EVENT</h2>
        <p>Coupon, PMH Vùng và PMH các Sản phẩm GVGS - Event</p>
    </div>

    <div class="section-user">
        <h3><i class="fa-solid fa-search"></i> Tra cứu & Nhận Coupon, PMH</h3>
        
        <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="userName" placeholder="Nhập User mới nhận được mã..." oninput="validateUser()">
        </div>
        
        <div class="input-group">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchKey" placeholder="Nhập mã phiếu cần lấy..." oninput="debouncedSearchCoupon()" disabled>
        </div>
        
        <div id="loadingText" class="loading-spinner" style="display:none;">
            <i class="fa-solid fa-spinner fa-spin" style="color: var(--primary)"></i> Đang đồng bộ kiểm tra dữ liệu...
        </div>
        
        <div id="resultArea"></div>
    </div>
</div>

<div id="textModal" class="admin-modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeTextModal()"><i class="fa-solid fa-xmark"></i></button>
        <h3><i class="fa-solid fa-paste"></i> Lọc & Bổ sung PMH Vùng </h3>
        
        <label class="input-label"><i class="fa-solid fa-filter"></i> Nhập User QL/TC (phân cách bằng dấu phẩy):</label>
        <div class="input-group" style="margin-bottom: 12px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="filterKeywords" placeholder="Ví dụ: 53136, Vủ..." oninput="saveFilterKeywords()">
        </div>

        <label class="input-label"><i class="fa-solid fa-database"></i> Dán dữ liệu tin nhắn thô từ DM hoặc danh sách PMH:</label>
        <textarea id="rawTextCoupons" rows="7" placeholder="Dán toàn bộ tin nhắn từ DM vào đây"></textarea>
        
        <button class="btn-secondary" onclick="handleImportTextCoupons()">
            <i class="fa-solid fa-filter-circle-dollar"></i> Lọc Theo User & Bổ Sung Mã Vào Sheet
        </button>
        <div id="textStatus"></div>
    </div>
</div>

<div id="adminModal" class="admin-modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeAdminModal()"><i class="fa-solid fa-xmark"></i></button>
        
        <div id="adminDashboardSection">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin:0;"><i class="fa-solid fa-chart-pie"></i> Thống Kê </h3>
            </div>

            <div class="stats-grid">
                <div class="stat-card remaining">
                    <div class="stat-label">Còn lại</div>
                    <div class="stat-value" id="statRemaining">0</div>
                </div>
                <div class="stat-card claimed">
                    <div class="stat-label">Đã sử dụng</div>
                    <div class="stat-value" id="statClaimed">0</div>
                </div>
                <div class="stat-card total">
                    <div class="stat-label">Tổng Coupon</div>
                    <div class="stat-value" id="statTotal">0</div>
                </div>
            </div>

            <div class="admin-section-title"><i class="fa-solid fa-boxes-stacked"></i> Thống kê theo sản phẩm</div>
            <div class="product-stats-list" id="productStatsList">
                <div style="text-align: center; color: var(--text-muted); padding: 10px;">Chưa có dữ liệu</div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

            <div class="admin-section-title"><i class="fa-solid fa-broom"></i> Quản lý Sheet TextCoupons</div>
            <button class="btn-danger" onclick="handleDeleteUsedTextCoupons()" style="margin-bottom: 12px;">
                <i class="fa-solid fa-trash-can"></i> Xóa PMH Vùng Đã Sử Dụng
            </button>

            <div id="adminStatus"></div>
        </div>
    </div>
</div>

<script>
    // DÁN URL MỚI TỪ APPSCRIPT VÀO ĐÂY
    const API_URL = "https://script.google.com/macros/s/AKfycbyelpDARRrPc0loyi45T3BNypYVArjzbx6lUkVJ4Rl4iudUmkQ8f_rbf_CrSed5G4jj/exec"; 
    
    let localData = []; 
    let searchDebounceTimer = null;

    window.onload = function() {
        const cachedStr = localStorage.getItem("CACHED_COUPONS_DATA");
        if (cachedStr) {
            try {
                const cachedData = JSON.parse(cachedStr);
                applyDataToUI(cachedData);
            } catch (e) {
                console.error("Lỗi parse Cache Local:", e);
            }
        }
        
        refreshData(!cachedStr);
    };

    async function handleManualUpdate(btnElement) {
        const icon = btnElement ? btnElement.querySelector('i') : null;
        if (icon) icon.classList.add('fa-spin');
        
        showToast("Đang cập nhật dữ liệu từ Sheet...", "info");
        await refreshData(true);
        
        if (icon) icon.classList.remove('fa-spin');
        showToast("Đã cập nhật dữ liệu mới nhất!", "success");
    }

    function applyDataToUI(dataObj) {
        localData = dataObj.coupons || [];

        validateUser();
        updateAdminDashboard();
        if (document.getElementById("searchKey").value.trim()) searchCoupon();
    }

    async function refreshData(showSpinner = false) {
        if (showSpinner) showLoading(true);
        try {
            // Thêm Cache-Buster timestamp để tránh lưu cache cũ
            const cacheBuster = "_t=" + new Date().getTime();
            const fetchUrl = API_URL.includes("?") ? `${API_URL}&${cacheBuster}` : `${API_URL}?${cacheBuster}`;

            let response = await fetch(fetchUrl);
            let resultObject = await response.json();
            
            localStorage.setItem("CACHED_COUPONS_DATA", JSON.stringify(resultObject));
            applyDataToUI(resultObject);

        } catch (error) {
            console.error("Lỗi tải dữ liệu:", error);
            if (showSpinner) showToast("Lỗi đồng bộ dữ liệu!", "error");
        }
        if (showSpinner) showLoading(false);
    }

    function showToast(message, type = 'info') {
        let container = document.getElementById("toastContainer");
        if (!container) {
            container = document.createElement("div");
            container.id = "toastContainer";
            container.className = "toast-container";
            document.body.appendChild(container);
        }

        const toast = document.createElement("div");
        toast.className = `toast toast-${type}`;
        
        let iconClass = 'fa-circle-info';
        if (type === 'success') iconClass = 'fa-circle-check';
        if (type === 'error') iconClass = 'fa-circle-xmark';

        toast.innerHTML = `<i class="fa-solid ${iconClass}"></i> <span>${message}</span>`;
        container.appendChild(toast);

        requestAnimationFrame(() => toast.classList.add("show"));

        setTimeout(() => {
            toast.classList.remove("show");
            setTimeout(() => {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 300);
        }, 3000);
    }

    function openTextModal() {
        document.getElementById("textModal").style.display = "flex";
        const tuKhoaDaLuu = localStorage.getItem('tuKhoaPMH_Backup');
        if (tuKhoaDaLuu) document.getElementById('filterKeywords').value = tuKhoaDaLuu;
    }

    function saveFilterKeywords() {
        localStorage.setItem('tuKhoaPMH_Backup', document.getElementById('filterKeywords').value);
    }

    function closeTextModal() {
        document.getElementById("textModal").style.display = "none";
        document.getElementById("textStatus").innerHTML = "";
    }

    function openAdminModal() {
        document.getElementById("adminModal").style.display = "flex";
        updateAdminDashboard();
    }

    function closeAdminModal() {
        document.getElementById("adminModal").style.display = "none";
        document.getElementById("adminStatus").innerHTML = "";
    }

    function updateAdminDashboard() {
        let total = localData.length;
        let claimed = 0;
        let remaining = 0;
        let productMap = {};

        localData.forEach(item => {
            let isClaimed = !!item.claimedBy;
            if (isClaimed) claimed++; else remaining++;

            let prodName = item.productName || "Sản phẩm không tên";
            if (!productMap[prodName]) productMap[prodName] = { total: 0, remaining: 0, claimed: 0 };
            
            productMap[prodName].total++;
            if (isClaimed) productMap[prodName].claimed++;
            else productMap[prodName].remaining++;
        });

        document.getElementById("statTotal").innerText = total;
        document.getElementById("statRemaining").innerText = remaining;
        document.getElementById("statClaimed").innerText = claimed;

        const listContainer = document.getElementById("productStatsList");
        listContainer.innerHTML = "";

        if (Object.keys(productMap).length === 0) {
            listContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 10px;">Chưa có dữ liệu Coupon</div>`;
            return;
        }

        for (let pName in productMap) {
            let pData = productMap[pName];
            let itemDiv = document.createElement("div");
            itemDiv.className = "product-stat-item";
            let badgeStyleClass = (pData.claimed > 0) ? "badge-used" : "badge-unused";

            itemDiv.innerHTML = `
                <span class="product-stat-name" title="${pName}">${pName}</span>
                <span class="product-stat-count ${badgeStyleClass}">
                    Còn lại: <b>${pData.remaining}</b> / ${pData.total}
                </span>
            `;
            listContainer.appendChild(itemDiv);
        }
    }

    function showLoading(isLoading) {
        document.getElementById("loadingText").style.display = isLoading ? "block" : "none";
    }

    function validateUser() {
        const userNameInput = document.getElementById("userName");
        const searchInput = document.getElementById("searchKey");
        const resultArea = document.getElementById("resultArea");

        if (userNameInput.value.trim().length > 0) {
            searchInput.disabled = false;
            searchInput.placeholder = "Gõ tên sản phẩm cần tìm...";
        } else {
            searchInput.disabled = true;
            searchInput.value = "";
            searchInput.placeholder = "Vui lòng điền tên trước khi tìm sản phẩm...";
            resultArea.innerHTML = "";
        }
    }

    function filterRawMessageByKeywords(dataGoc, tuKhoaInput) {
        const danhSachTuKhoa = tuKhoaInput.split(',').map(tk => tk.trim().toLowerCase()).filter(tk => tk !== "");
        if (danhSachTuKhoa.length === 0) return dataGoc; 

        const cacKhoi = dataGoc.split(/━━━━━━+/);
        let ketQuaDong = [];

        cacKhoi.forEach(khoi => {
            const cacDong = khoi.split('\n').map(d => d.trim()).filter(d => d !== "");
            if (cacDong.length >= 2) {
                const dongThongTin = cacDong[0].toLowerCase();
                const dongMuiTen = cacDong[1];
                if (danhSachTuKhoa.some(tuKhoa => dongThongTin.includes(tuKhoa)) && dongMuiTen.startsWith('➜')) {
                    ketQuaDong.push(dongMuiTen);
                }
            }
        });

        return ketQuaDong.join('\n');
    }

    function parseTextCoupons(rawText) {
        const lines = rawText.split("\n");
        const parsedResults = [];
        const seenInText = new Set(); 
        const existingCodesInSystem = new Set(localData.map(item => item.coupon ? item.coupon.trim().toUpperCase() : ""));

        lines.forEach(line => {
            let cleanLine = line.trim().replace(/^➜\s*/, "");
            const parts = cleanLine.split(":");
            
            if (parts.length >= 2) {
                const productName = parts[0].trim();
                const couponCode = parts[1].trim();
                const upperCode = couponCode.toUpperCase();

                if (productName && couponCode && !seenInText.has(upperCode) && !existingCodesInSystem.has(upperCode)) {
                    seenInText.add(upperCode);
                    parsedResults.push({ productName: productName, coupon: couponCode });
                }
            }
        });

        return parsedResults;
    }

    function handleImportTextCoupons() {
        const rawContent = document.getElementById("rawTextCoupons").value.trim();
        const keywordsStr = document.getElementById("filterKeywords").value.trim();
        const statusDiv = document.getElementById("textStatus");

        if (!rawContent) return alert("Vui lòng dán văn bản tin nhắn hoặc danh sách mã coupon vào khung!");

        let textToParse = keywordsStr ? filterRawMessageByKeywords(rawContent, keywordsStr) : rawContent;
        if (!textToParse.trim()) return alert("Không tìm thấy mã PMH nào khớp với từ khóa đã nhập!");

        const parsedCoupons = parseTextCoupons(textToParse);
        if (parsedCoupons.length === 0) return alert("Tất cả mã đã lọc đều bị trùng lặp hoặc sai định dạng!");

        statusDiv.className = "";
        statusDiv.innerHTML = `<i class='fa-solid fa-spinner fa-spin'></i> Đang tải lên ${parsedCoupons.length} coupon đã lọc...`;

        const formData = new URLSearchParams();
        formData.append("action", "appendTextData");
        formData.append("textCoupons", JSON.stringify(parsedCoupons));

        fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        }).then(() => {
            statusDiv.className = "status-success";
            statusDiv.innerHTML = `<i class='fa-solid fa-circle-check'></i> Đã thêm ${parsedCoupons.length} mã duy nhất vào Sheet.`;
            showToast(`Thành công thêm ${parsedCoupons.length} mã!`, 'success');
            document.getElementById("rawTextCoupons").value = "";
            setTimeout(() => refreshData(false), 1200);
        }).catch(err => {
            statusDiv.className = "status-error";
            statusDiv.innerHTML = "<i class='fa-solid fa-circle-xmark'></i> Lỗi gửi dữ liệu: " + err;
            showToast("Lỗi tải dữ liệu!", "error");
        });
    }

    async function handleDeleteUsedTextCoupons() {
        const password = prompt("Nhập mật khẩu quản trị để thực hiện xóa:");
        if (!password) return;
        if (password !== "53136") {
            alert("Mật khẩu không đúng!");
            return;
        }

        if (!confirm("Bạn có chắc chắn muốn xóa toàn bộ Coupon đã sử dụng trong Sheet TextCoupons?")) return;

        const statusDiv = document.getElementById("adminStatus");
        statusDiv.className = "";
        statusDiv.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Đang tiến hành xóa coupon đã dùng...";

        const formData = new URLSearchParams();
        formData.append("action", "deleteUsedTextCoupons");
        formData.append("password", password);

        try {
            let res = await fetch(API_URL, { method: "POST", body: formData });
            let data = await res.json();
            if (data.success) {
                showToast(data.message, "success");
                statusDiv.className = "status-success";
                statusDiv.innerHTML = `<i class='fa-solid fa-circle-check'></i> ${data.message}`;
                await refreshData(false);
            } else {
                showToast(data.message, "error");
                statusDiv.className = "status-error";
                statusDiv.innerHTML = `<i class='fa-solid fa-circle-xmark'></i> ${data.message}`;
            }
        } catch (err) {
            statusDiv.className = "status-error";
            statusDiv.innerHTML = "<i class='fa-solid fa-circle-xmark'></i> Lỗi xử lý xóa!";
        }
    }

    function debouncedSearchCoupon() {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(searchCoupon, 200);
    }

    function searchCoupon() {
        const keyword = document.getElementById("searchKey").value.toLowerCase().trim();
        const resultArea = document.getElementById("resultArea");
        resultArea.innerHTML = "";

        if (!keyword) return;

        let grouped = {};
        let hasMatch = false;

        localData.forEach(item => {
            if (item.productName && item.productName.toLowerCase().includes(keyword)) {
                if (!grouped[item.productName]) grouped[item.productName] = [];
                grouped[item.productName].push(item);
                hasMatch = true;
            }
        });

        if (!hasMatch) {
            resultArea.innerHTML = "<div class='loading-spinner'>Không tìm thấy coupon cho sản phẩm này.</div>";
            return;
        }

        for (let prodName in grouped) {
            let cardDiv = document.createElement("div");
            cardDiv.className = "product-card";
            
            grouped[prodName].sort((a, b) => (a.claimedBy ? 1 : 0) - (b.claimedBy ? 1 : 0));

            let html = `<div class="product-title"><i class="fa-solid fa-box-open" style="color:var(--primary);"></i> ${prodName}</div>`;
            html += `<div class="coupon-list">`;
            
            grouped[prodName].forEach(item => {
                const isClaimed = !!item.claimedBy;
                const itemClass = isClaimed ? "coupon-item claimed" : "coupon-item";
                
                let actionHtml = "";
                if (isClaimed) {
                    actionHtml = `
                        <div class="claimed-info">
                            <span class="claimed-user"><i class="fa-solid fa-user-check"></i> ${item.claimedBy}</span>
                            <span class="claimed-time"><i class="fa-solid fa-clock"></i> ${item.claimedAt || 'Đã nhận'}</span>
                        </div>
                    `;
                } else {
                    actionHtml = `
                        <button class="btn-copy" onclick="copyAndClaim('${item.coupon}', this)">
                            <i class="fa-solid fa-copy"></i> Nhận Mã
                        </button>
                    `;
                }

                html += `
                    <div class="${itemClass}">
                        <span class="coupon-code">${item.coupon}</span>
                        ${actionHtml}
                    </div>
                `;
            });
            
            html += `</div>`;
            cardDiv.innerHTML = html;
            resultArea.appendChild(cardDiv);
        }
    }

    function copyAndClaim(couponCode, buttonEl) {
        const user = document.getElementById("userName").value.trim();
        if (!user) {
            alert("Vui lòng điền tên trước khi nhận mã!");
            return;
        }

        const now = new Date();
        const formattedTime = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' ' + now.toLocaleDateString('vi-VN');

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(couponCode).catch(() => fallbackCopyTextToClipboard(couponCode));
        } else {
            fallbackCopyTextToClipboard(couponCode);
        }

        showToast(`Đã sao chép mã: ${couponCode}`, 'success');

        const parentEl = buttonEl.closest('.coupon-item');
        if (parentEl) {
            parentEl.classList.add('claimed');
            buttonEl.outerHTML = `
                <div class="claimed-info">
                    <span class="claimed-user"><i class="fa-solid fa-user-check"></i> ${user}</span>
                    <span class="claimed-time"><i class="fa-solid fa-clock"></i> ${formattedTime}</span>
                </div>
            `;
        }

        localData = localData.map(item => {
            if (item.coupon === couponCode) {
                item.claimedBy = user;
                item.claimedAt = formattedTime;
            }
            return item;
        });

        localStorage.setItem("CACHED_COUPONS_DATA", JSON.stringify({
            coupons: localData
        }));

        updateAdminDashboard();

        fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "claimCoupon",
                coupon: couponCode,
                user: user,
                claimedAt: formattedTime
            })
        })
        .then(res => res.json())
        .then(dataRes => {
            if (dataRes.success === false) {
                showToast(dataRes.message || "Không thể đồng bộ với máy chủ!", "error");
                refreshData(false);
            }
        })
        .catch(error => {
            console.error("Lỗi đồng bộ ngầm:", error);
            showToast("Lỗi kết nối ngầm! Đang tải lại...", "error");
            refreshData(false);
        });
    }

    function fallbackCopyTextToClipboard(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.top = "0"; textArea.style.left = "0";
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus(); textArea.select();
        try { document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(textArea);
    }
</script>
